<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCoach V2 - Szkoła (7-15 lat)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            text-align: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
        .badge {
            display: inline-block;
            background: #00d4ff;
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin: 15px 0;
        }
        p { font-size: 1.2em; line-height: 1.8; margin: 20px 0; }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            transition: transform 0.3s;
        }
        .feature:hover { transform: translateY(-5px); }
        .button {
            display: inline-block;
            padding: 15px 40px;
            background: #00d4ff;
            color: #000;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s;
        }
        .button:hover { background: #fff; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 MiniCoach V2</h1>
        <div class="badge">Moduł Szkolny (7-15 lat)</div>
        <p>Zaawansowane narzędzie wsparcia neurorozwoju z AI</p>
        <div class="features">
            <div class="feature">
                <h3>🧠 Trening poznawczy</h3>
                <p>Zadania rozwojowe</p>
            </div>
            <div class="feature">
                <h3>🎮 Gry edukacyjne</h3>
                <p>Interaktywna nauka</p>
            </div>
            <div class="feature">
                <h3>📊 Panel nauczyciela</h3>
                <p>Monitorowanie postępów</p>
            </div>
        </div>
        <a href="#" class="button">🚀 Uruchom platformę</a>
        <a href="../index.html" class="button">🏠 Powrót do menu</a>
    </div>
</body>
</html>
