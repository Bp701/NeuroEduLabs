<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>NeuroEduLabs | Copernix OS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-border { border: 1px solid #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-4xl w-full text-center mb-12">
        <p class="text-amber-400 text-[10px] uppercase tracking-[0.5em] mb-4">Status IP: Wycena 2.250.000 PLN // TRL 7 Ready</p>
        <h1 class="text-5xl font-bold mb-4">NeuroEduLabs<span class="text-blue-500">.</span></h1>
        <p class="text-slate-400 max-w-2xl mx-auto italic">"Budujemy technologię, która adaptuje się do mózgu dziecka – nie odwrotnie."</p>
    </div>

    <div class="glass p-8 rounded-2xl gold-border max-w-md w-full text-center">
        <h2 class="text-xl font-bold mb-6">Wprowadź Klucz Licencji</h2>
        <input type="password" id="pin" placeholder="XXXX" maxlength="4" 
               class="bg-black border border-slate-700 text-amber-400 text-center text-4xl w-40 p-3 mb-8 outline-none focus:border-amber-400 rounded-lg">
        
        <div class="grid grid-cols-1 gap-4">
            <button onclick="access('bridge.html')" class="w-full py-4 bg-blue-600 font-bold uppercase rounded-lg hover:bg-blue-500 transition">Mostek Andromeda (Admin)</button>
            <button onclick="access('v2/index.html')" class="w-full py-4 glass border-slate-600 font-bold uppercase rounded-lg hover:bg-slate-700 transition">Moduł Szkoła (V2)</button>
            <button onclick="access('v1/index.html')" class="w-full py-4 glass border-slate-600 font-bold uppercase rounded-lg hover:bg-slate-700 transition">Moduł Junior (V1)</button>
        </div>
        <p id="err" class="text-red-500 text-xs mt-4 hidden">NIEPRAWIDŁOWY KLUCZ DOSTĘPU</p>
    </div>

    <script>
        function access(target) {
            const pin = document.getElementById('pin').value;
            if(pin === "2026") {
                window.location.href = target;
            } else {
                document.getElementById('err').classList.remove('hidden');
                setTimeout(() => document.getElementById('err').classList.add('hidden'), 2000);
            }
        }
    </script>
</body>
</html>
