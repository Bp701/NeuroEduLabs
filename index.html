<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroEduLabs | Teacher Hub v2.5 Platinum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #020617; 
            color: #00d4ff; 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(0, 212, 255, 0.2); 
        }
        .audit-shield { 
            border-left: 4px solid #f59e0b; 
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.1); 
        }
        .scan-line {
            height: 2px;
            background: rgba(0, 212, 255, 0.5);
            position: absolute;
            width: 100%;
            top: 0;
            animation: scan 4s infinite linear;
        }
        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-white text-center">
    <div class="scan-line"></div>

    <div id="pin-panel" class="glass p-12 text-center w-full max-w-md rounded-[3rem] relative overflow-hidden shadow-2xl z-50">
        <h1 class="text-6xl font-black italic mb-2 tracking-tighter text-white">COPERNIX</h1>
        <p class="text-[10px] tracking-[0.5em] uppercase opacity-40 mb-10 text-white font-bold italic">NeuroEduLabs Intelligence</p>
        <input type="password" id="pin" placeholder="PIN: 2026" class="w-full bg-black/50 border border-cyan-900 p-4 rounded-2xl text-center text-2xl tracking-[0.8em] outline-none focus:border-cyan-500 mb-6 text-white font-bold">
        <button onclick="unlock()" class="w-full py-5 bg-cyan-600 hover:bg-cyan-400 text-black font-bold rounded-2xl uppercase tracking-widest transition-all">Autoryzuj Panel</button>
    </div>

    <div id="main-hub" class="hidden w-full max-w-6xl animate-in fade-in duration-1000 z-50">
        <div class="audit-shield glass p-8 mb-10 grid grid-cols-1 md:grid-cols-3 gap-6 text-[11px] rounded-3xl text-left">
            <div>
                <p class="text-amber-500 font-bold uppercase mb-1">Inżynier Projektu:</p>
                <p class="text-white text-sm">Piotr Brodziński (User Zero)</p>
            </div>
            <div>
                <p class="text-amber-500 font-bold uppercase mb-1">Status IP / TRL:</p>
                <p class="text-white text-sm">2.25M PLN | TRL 7 Gold Master</p>
            </div>
            <div class="text-right">
                <p class="text-amber-500 font-bold uppercase mb-1">System:</p>
                <p class="text-white text-lg font-bold">Behavioral AI Shield Active</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a href="junior-v1/index.html" class="glass p-12 rounded-[3rem] border-t-2 border-pink-500 hover:scale-105 transition-all group">
                <div class="text-7xl mb-6">🧸</div>
                <h2 class="text-2xl font-bold uppercase tracking-widest text-pink-400">Luna Junior</h2>
                <p class="text-xs opacity-50 mt-2 italic text-white">Moduł Przedszkolny (v1)</p>
            </a>

            <a href="bridge.html" class="glass p-12 rounded-[3rem] border-t-2 border-cyan-500 hover:scale-105 transition-all group">
                <div class="text-7xl mb-6">🛰️</div>
                <h2 class="text-2xl font-bold uppercase tracking-widest text-cyan-400">Andromeda Bridge</h2>
                <p class="text-xs opacity-50 mt-2 italic text-white">Moduł Szkolny 3D (v2)</p>
            </a>

            <a href="coach.html" class="glass p-12 rounded-[3rem] border-t-2 border-purple-500 hover:scale-105 transition-all group">
                <div class="text-7xl mb-6 group-hover:animate-bounce">🚀</div>
                <h2 class="text-2xl font-bold uppercase tracking-widest text-purple-400">Maintenance</h2>
                <p class="text-xs opacity-50 mt-2 italic text-white">Regulacja Behawioralna</p>
            </a>
        </div>
    </div>

    <script>
        function unlock() {
            const inputPin = document.getElementById('pin').value;
            if(inputPin === "2026") {
                // Naprawa błędu NULL - pobieramy adres ngrok z prompta i zapisujemy w przeglądarce
                let addr = prompt("WPROWADŹ AKTUALNY ADRES NGROK (np. https://unauthentic...):", localStorage.getItem('active_ngrok') || "");
                
                if(addr) {
                    // Usuwamy ukośnik na końcu, jeśli użytkownik go dodał
                    if(addr.endsWith('/')) addr = addr.slice(0, -1);
                    
                    localStorage.setItem('active_ngrok', addr);
                    
                    // Animacja przejścia
                    gsap.to("#pin-panel", { opacity: 0, y: -50, duration: 0.5, onComplete: () => {
                        document.getElementById('pin-panel').style.display = 'none';
                        document.getElementById('main-hub').classList.remove('hidden');
                        gsap.from("#main-hub", { opacity: 0, y: 50, duration: 1 });
                    }});
                } else {
                    alert("Adres NGROK jest niezbędny do komunikacji z rdzeniem AI!");
                }
            } else {
                alert("Nieprawidłowy kod PIN.");
            }
        }
    </script>
</body>
</html>
