<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>NeuroEduLabs | Copernix OS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000510; color: #00d4ff; font-family: sans-serif; }
        .glass { background: rgba(0, 20, 40, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 212, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full glass p-8 rounded-xl text-center">
        <h1 class="text-4xl font-bold mb-2">Copernix OS</h1>
        <p class="text-xs text-cyan-600 uppercase tracking-widest mb-8 italic">TRL 7 Infrastructure</p>
        
        <div class="mb-6">
            <label class="block text-[10px] uppercase mb-2">Wprowadź Klucz Licencji</label>
            <input type="password" id="pin" placeholder="XXXX" maxlength="4" 
                   class="bg-black border border-cyan-900 text-cyan-400 text-center text-2xl w-full p-3 outline-none focus:border-cyan-400">
        </div>
        
        <button onclick="unlock()" class="w-full py-4 bg-cyan-900/50 border border-cyan-400 font-bold uppercase hover:bg-cyan-400 hover:text-black transition">
            Autoryzuj Dostęp
        </button>
        <p id="err" class="text-red-500 text-xs mt-4 hidden">BŁĘDNY KLUCZ DOSTĘPU</p>
    </div>

    <script>
        function unlock() {
            const pin = document.getElementById('pin').value;
            if(pin === "2026") {
                // Wybór wersji po zalogowaniu
                const choice = confirm("OK: Luna Junior (Anuluj) | Szkoła V2 (OK)");
                window.location.href = choice ? "v2/index.html" : "v1/index.html";
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
