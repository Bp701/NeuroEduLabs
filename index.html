<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>NeuroEduLabs | Teacher Hub v2.5 Platinum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #00d4ff; font-family: 'Rajdhani', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 212, 255, 0.2); }
        .audit-shield { border-left: 4px solid #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-white text-center">

    <div id="pin-panel" class="glass p-12 text-center w-full max-w-md rounded-[3rem] relative shadow-2xl">
        <h1 class="text-6xl font-black italic mb-2 tracking-tighter">COPERNIX</h1>
        <p class="text-[10px] tracking-[0.5em] uppercase opacity-40 mb-10 font-bold">NeuroEduLabs Intelligence</p>
        <input type="password" id="pin" placeholder="PIN: 2026" class="w-full bg-black/50 border border-cyan-900 p-4 rounded-2xl text-center text-2xl tracking-[0.8em] outline-none focus:border-cyan-500 mb-6 text-white font-bold">
        <button onclick="unlock()" class="w-full py-5 bg-cyan-600 hover:bg-cyan-400 text-black font-bold rounded-2xl uppercase tracking-widest transition-all">Autoryzuj Panel</button>
    </div>

    <div id="main-hub" class="hidden w-full max-w-6xl animate-in fade-in duration-1000">
        <div class="audit-shield glass p-8 mb-10 grid grid-cols-1 md:grid-cols-3 gap-6 text-[11px] rounded-3xl text-left">
            <div><p class="text-amber-500 font-bold uppercase mb-1">Inżynier Projektu:</p><p class="text-white text-sm">Piotr Brodziński (User Zero)</p></div>
            <div><p class="text-amber-500 font-bold uppercase mb-1">Status IP / TRL:</p><p class="text-white text-sm">2.25M PLN | TRL 7 Gold Master</p></div>
            <div class="text-right"><p class="text-amber-500 font-bold uppercase mb-1">System:</p><p class="text-white text-lg font-bold">Behavioral AI Shield Active</p></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a href="junior-v1/index.html" class="glass p-12 rounded-[3rem] border-t-2 border-pink-500 hover:scale-105 transition-all group">
                <div class="text-7xl mb-6">🧸</div>
                <h2 class="text-2xl font-bold uppercase text-pink-400">Junior</h2>
                <p class="text-xs opacity-50 mt-2 italic text-white">Wersja v1 (Przedszkola)</p>
            </a>
            <a href="bridge.html" class="glass p-12 rounded-[3rem] border-t-2 border-cyan-500 hover:scale-105 transition-all group">
                <div class="text-7xl mb-6">🛰️</div>
                <h2 class="text-2xl font-bold uppercase text-cyan-400">Bridge</h2>
                <p class="text-xs opacity-50 mt-2 italic text-white">Wersja v2 (Szkoły 3D)</p>
            </a>
            <a href="coach.html" class="glass p-12 rounded-[3rem] border-t-2 border-purple-500 hover:scale-105 transition-all group">
                <div class="text-7xl mb-6 group-hover:animate-bounce">🚀</div>
                <h2 class="text-2xl font-bold uppercase text-purple-400">Maintenance</h2>
                <p class="text-xs opacity-50 mt-2 italic text-white">System Wyciszania Klasy</p>
            </a>
        </div>
    </div>

    <script>
        function unlock() {
            if(document.getElementById('pin').value === "2026") {
                let addr = prompt("WPROWADŹ ADRES NGROK Z TWOJEGO MSI:", localStorage.getItem('active_ngrok') || "");
                if(addr) {
                    if(addr.endsWith('/')) addr = addr.slice(0, -1);
                    localStorage.setItem('active_ngrok', addr);
                    document.getElementById('pin-panel').style.display = 'none';
                    document.getElementById('main-hub').classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
