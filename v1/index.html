<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Junior - Przedszkole (3-6 lat)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .emoji { font-size: 4em; margin: 20px 0; }
        p { font-size: 1.3em; line-height: 1.6; margin: 20px 0; }
        .button {
            display: inline-block;
            padding: 15px 40px;
            background: #fff;
            color: #667eea;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
            transition: transform 0.2s;
        }
        .button:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🌈✨🎨</div>
        <h1>Luna Junior</h1>
        <p>Witamy w magicznym świecie nauki dla maluchów!</p>
        <p><strong>Moduł Przedszkolny (3-6 lat)</strong></p>
        <p>Zabawowe ćwiczenia sensoryczne, kolorowe gry i interaktywne przygody!</p>
        <a href="#" class="button">🎮 Rozpocznij zabawę</a>
        <a href="../index.html" class="button">🏠 Powrót do menu</a>
    </div>
</body>
</html>
