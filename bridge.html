<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>COPERNIX | BRIDGE V2 PLATINUM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="sector_data.js"></script>
    <script src="warmia_module.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Rajdhani', sans-serif; }
        .hud-glass { background: rgba(0, 10, 25, 0.85); border: 1px solid #00d4ff; backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div class="absolute top-8 left-8 hud-glass p-6 w-80 z-50 rounded border-l-4 border-cyan-500 shadow-2xl">
        <h1 class="text-2xl font-bold text-white uppercase italic tracking-tighter">Copernix Bridge</h1>
        <p class="text-cyan-500 text-[10px] font-bold tracking-widest uppercase">Lokalizacja: Olsztyn-Mars Link</p>
        <div id="logs" class="mt-4 text-[9px] font-mono text-cyan-300 h-20 overflow-hidden leading-tight">> System Ready...</div>
    </div>

    <div class="absolute top-40 left-8 flex flex-col gap-2 z-50">
        <button onclick="changeSector('olsztyn_zamek')" class="bg-cyan-900/50 border border-cyan-500 p-2 text-[10px] text-white hover:bg-cyan-500 transition uppercase font-bold">🏰 Olsztyn Zamek</button>
        <button onclick="changeSector('sniardwy_port')" class="bg-cyan-900/50 border border-cyan-500 p-2 text-[10px] text-white hover:bg-cyan-500 transition uppercase font-bold">⛵ Śniardwy</button>
        <button onclick="changeSector('mars_base')" class="bg-cyan-900/50 border border-cyan-500 p-2 text-[10px] text-white hover:bg-cyan-500 transition uppercase font-bold">🚀 Baza Mars</button>
        <button onclick="changeSector('deep_space')" class="bg-cyan-900/50 border border-cyan-500 p-2 text-[10px] text-white hover:bg-cyan-500 transition uppercase font-bold">🌌 Kosmos</button>
    </div>

    <div id="three-container"></div>

    <script>
        let scene, camera, renderer;
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 10000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('three-container').appendChild(renderer.domElement);
            
            camera.position.set(0, 150, 600);
            animate();
            console.log("Bridge V2 Loaded. Wybierz sektor.");
        }
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        window.onload = init;

        function changeSector(id) {
            document.getElementById('logs').innerHTML += `<br>> Przeskok: ${id.toUpperCase()}...`;
            // Tutaj warmia_module.js i sector_data.js wykonują magię ładowania terenu
        }
    </script>
</body>
</html>
