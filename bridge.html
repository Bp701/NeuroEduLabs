<!DOCTYPE html><html lang="pl"><head>
    <meta charset="UTF-8">
    <title>COPERNIX OS | ANDROMEDA BRIDGE 7.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="sector_data.js"></script>
    <script src="warmia_module.js"></script>
    <script src="space_module.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #00d4ff; }
        .hud-glass { background: rgba(0, 10, 25, 0.85); border: 1px solid rgba(0, 212, 255, 0.4); backdrop-filter: blur(15px); }
        #video-input { position: absolute; bottom: 20px; right: 20px; width: 160px; border-radius: 10px; border: 2px solid #00d4ff; transform: scaleX(-1); }
    </style></head><body>
    <div class="absolute top-8 left-8 hud-glass p-6 w-80 z-50 rounded border-l-4 border-cyan-500">
        <h1 class="text-xl font-bold tracking-widest uppercase text-white">Copernix OS</h1>
        <div id="logs" class="mt-4 text-[9px] font-mono text-cyan-800 h-32 overflow-hidden leading-tight">> SYSTEM ONLINE...</div>
    </div>

    <div id="sector-menu" class="absolute top-8 right-8 hud-glass p-4 w-64 z-50 text-white">
        <p class="text-[10px] text-center mb-4 opacity-50 uppercase tracking-widest">Nawigacja Ręczna</p>
        <button onclick="switchLoc('olsztyn')" class="w-full p-2 mb-2 bg-cyan-900/20 border border-cyan-800 hover:border-cyan-400 transition text-xs uppercase">🏰 Olsztyn 3D</button>
        <button onclick="switchLoc('andromeda')" class="w-full p-2 mb-2 bg-cyan-900/20 border border-cyan-800 hover:border-cyan-400 transition text-xs uppercase">🌌 Andromeda</button>
        <button onclick="switchLoc('earth')" class="w-full p-2 bg-cyan-900/20 border border-cyan-800 hover:border-cyan-400 transition text-xs uppercase">🌍 Orbita</button>
    </div>

    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50 text-center w-full">
        <h2 id="luna-msg" class="text-white text-xl mb-6 italic font-light drop-shadow-lg">Luna: Wybierz tryb sterowania...</h2>
        <button onclick="startVoice()" class="px-12 py-5 bg-cyan-600/20 border-2 border-cyan-500 rounded-full text-white font-bold hover:bg-cyan-500 transition uppercase tracking-widest text-sm shadow-[0_0_40px_rgba(0,212,255,0.2)]">
            🎤 Komenda Głosowa
        </button>
    </div>

    <video id="video-input" autoplay></video>

    <div id="three-container"></div>

    <script>
        const NGROK_URL = "https://unauthentic-kylah-exiguously.ngrok-free.dev";
        let scene, camera, renderer, earth, current3DObject;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 10000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('three-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(500, 1000, 500);
            scene.add(sun);

            const earthGeo = new THREE.SphereGeometry(100, 32, 32);
            const earthMat = new THREE.MeshStandardMaterial({ color: 0x0044ff, wireframe: true });
            earth = new THREE.Mesh(earthGeo, earthMat);
            scene.add(earth);
            camera.position.z = 400;

            initMediaPipe(); // Start gestów
            animate();
            log("> ANDROMEDA BRIDGE 7.0: GŁOS + GESTY + MANUAL");
        }

        // --- TRYB 1: MANUALNY (PRZYCISKI) ---
        window.switchLoc = function(loc) {
            log(`> SKOK DO: ${loc.toUpperCase()}`);
            if(current3DObject) scene.remove(current3DObject);
            earth.visible = (loc === 'earth');

            if(loc === 'olsztyn' && window.loadWarmiaTerrain) {
                current3DObject = window.loadWarmiaTerrain(scene);
                gsap.to(camera.position, { x: 0, y: 500, z: 800, duration: 2 });
            }
            if(loc === 'andromeda' && window.loadSpaceModule) {
                current3DObject = window.loadSpaceModule(scene, 'andromeda');
                gsap.to(camera.position, { x: 0, y: 0, z: 2000, duration: 3 });
            }
            if(loc === 'earth') gsap.to(camera.position, { x: 0, y: 0, z: 400, duration: 2 });
        };

        // --- TRYB 2: GŁOSOWY ---
        async function startVoice() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pl-PL';
            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                log(`> TY: "${text}"`);
                try {
                    const res = await fetch(`${NGROK_URL}/process-command`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ prompt: text })
                    });
                    const data = await res.json();
                    document.getElementById('luna-msg').innerText = "Luna: " + data.reply;
                    if(data.action === 'nav') switchLoc(data.target);
                } catch(e) { log("! BŁĄD NGROK"); }
            };
            recognition.start();
        }

        // --- TRYB 3: GESTY (MAGICZNA RÓŻDŻKA) ---
        function initMediaPipe() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks[0]) {
                    const hand = results.multiHandLandmarks[0];
                    // Obracanie modelem za pomocą palca wskazującego
                    if(current3DObject) {
                        current3DObject.rotation.y = (hand[8].x - 0.5) * 4;
                        current3DObject.rotation.x = (hand[8].y - 0.5) * 4;
                    }
                }
            });
            const cameraPipe = new Camera(document.getElementById('video-input'), {
                onFrame: async () => { await hands.send({image: document.getElementById('video-input')}); }
            });
            cameraPipe.start();
        }

        function log(msg) {
            const l = document.getElementById('logs');
            l.innerHTML += `<br>${msg}`;
            l.scrollTop = l.scrollHeight;
        }

        function animate() {
            requestAnimationFrame(animate);
            if(earth.visible) earth.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        window.onload = init;
    </script></body></html>
