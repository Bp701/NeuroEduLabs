<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
        <title>COPERNIX | BRIDGE 12.5 PLATINUM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="warmia_module.js"></script>
    <script src="world_data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #00d4ff; }
        .hud-glass { background: rgba(0, 10, 25, 0.95); border: 1px solid #00d4ff; backdrop-filter: blur(25px); }
        #webcam { position: absolute; bottom: 20px; right: 20px; width: 180px; border: 2px solid #00d4ff; border-radius: 12px; transform: scaleX(-1); opacity: 0.6; z-index: 100; }
        .loading-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px #00d4ff; } 50% { box-shadow: 0 0 20px #00d4ff; } 100% { box-shadow: 0 0 0px #00d4ff; } }
    </style>
</head>
<body>
    <video id="webcam" autoplay></video>

    <div class="absolute top-8 left-8 hud-glass p-6 w-80 z-50 rounded border-l-4 border-cyan-500 shadow-2xl">
        <h1 class="text-3xl font-black italic tracking-tighter text-white uppercase">Copernix OS</h1>
        <p class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest mt-1">Neural Sync: Active | 143 FPS</p>
        <div id="logs" class="mt-4 text-[9px] font-mono h-24 overflow-hidden text-cyan-900 leading-tight">> System Ready...</div>
    </div>

    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50 text-center w-full max-w-xl">
        <h2 id="luna-msg" class="text-white text-xl mb-6 italic font-light drop-shadow-2xl">Luna: Czekam na komendę...</h2>
        <button id="mic-btn" onclick="startVoice()" class="px-12 py-5 bg-cyan-600/20 border-2 border-cyan-500 rounded-full text-white font-bold hover:bg-cyan-500 transition-all uppercase text-xs">
            🎤 Aktywuj Lunę
        </button>
    </div>

    <div id="three-container"></div>

    <script>
        const NGROK_URL = localStorage.getItem('active_ngrok');

        if (!NGROK_URL) {
            alert("BŁĄD: Brak adresu tunelu ngrok! Powrót do startu.");
            window.location.href = "index.html";
        }

        let scene, camera, renderer, earth, current3DObject, isProcessing = false;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 20000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('three-container').appendChild(renderer.domElement);

            // Gwiezdny pył
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<15000; i++) starPos.push((Math.random()-0.5)*10000, (Math.random()-0.5)*10000, (Math.random()-0.5)*10000);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.8})));

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(500, 1000, 500);
            scene.add(sun);

            // IMMERSIVE ZOOM START
            camera.position.set(0, 0, 5000);
            gsap.to(camera.position, { z: 500, duration: 4, ease: "power4.out" });

            initMediaPipe();
            animate();
            log("> MOSTEK ZALUDNIONY. SYSTEM GOTOWY.");
        }

        window.switchLoc = function(loc) {
            log(`> SKOK DO: ${loc.toUpperCase()}`);
            if(current3DObject) scene.remove(current3DObject);
            if(loc === 'olsztyn') {
                document.getElementById('luna-msg').innerText = "Luna: Renderuję Olsztyn 3D. Przelot nad Zamkiem...";
                current3DObject = window.loadWarmiaTerrain(scene);
                gsap.to(camera.position, { x: 0, y: 600, z: 1200, duration: 3, ease: "power2.inOut" });
            }
        };

        async function startVoice() {
                    if(isProcessing) { 
            log("> [ANTI-SPAM] Poczekaj na zakończenie poprzedniej komendy..."); 
            return; 
        }
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pl-PL';
            recognition.onstart = () => { 
                isProcessing = true;
                document.getElementById('mic-btn').classList.add('loading-pulse');
                document.getElementById('luna-msg').innerText = "Luna: Słucham...";
            };
            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                log(`> TY: \"${text}\"`);
                try {
                    const res = await fetch(`${NGROK_URL}/process-command`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ prompt: text })
                    });
                    const data = await res.json();
                    document.getElementById('luna-msg').innerText = "Luna: " + data.reply;
                    if(data.action === 'nav') switchLoc(data.target);
                        } catch(e) { 
            console.error("[PLATINUM 12.5] ERROR:", e); 
            log(`! BŁĄD KOMUNIKACJI: ${e.message || 'Nieznany błąd'}`); 
        }
            };
            recognition.onend = () => {
                isProcessing = false;
                document.getElementById('mic-btn').classList.remove('loading-pulse');
            };
            recognition.start();
        }

        function initMediaPipe() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.8 });
            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks[0]) {
                    const finger = results.multiHandLandmarks[0][8];
                    if(current3DObject) {
                        current3DObject.rotation.y = (finger.x - 0.5) * 6;
                        current3DObject.rotation.x = (finger.y - 0.5) * 3;
                    }
                }
            });
            new Camera(document.getElementById('webcam'), {
                onFrame: async () => { await hands.send({image: document.getElementById('webcam')}); }
            }).start();
        }

        function log(msg) {
            const l = document.getElementById('logs');
            l.innerHTML += `<br>> ${msg}`;
            l.scrollTop = l.scrollHeight;
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        window.onload = init;
    </script>
</body>
</html>
