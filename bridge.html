<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>COPERNIX | BRIDGE 12.5 PLATINUM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="sector_data.js"></script>
    <script src="warmia_module.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Rajdhani', sans-serif; }
        .hud-glass { background: rgba(0, 10, 25, 0.95); border: 1px solid #00d4ff; backdrop-filter: blur(25px); }
        #webcam { position: absolute; bottom: 20px; right: 20px; width: 180px; border: 2px solid #00d4ff; border-radius: 12px; transform: scaleX(-1); opacity: 0.6; z-index: 100; }
    </style>
</head>
<body>
    <video id="webcam" autoplay></video>
    <div class="absolute top-8 left-8 hud-glass p-6 w-80 z-50 rounded border-l-4 border-cyan-500 shadow-2xl">
        <h1 class="text-3xl font-black italic tracking-tighter text-white uppercase">Copernix OS</h1>
        <div class="flex items-center gap-2 mt-1">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest">Neural Link: Active | 143 FPS</span>
        </div>
        <div id="logs" class="mt-4 text-[9px] font-mono h-32 overflow-hidden text-cyan-900 leading-tight">> System Ready...</div>
    </div>
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50 text-center w-full max-w-2xl px-10">
        <h2 id="luna-msg" class="text-white text-2xl mb-8 italic drop-shadow-2xl text-white">Luna: Czekam na sygnał, Dominik...</h2>
        <button onclick="startVoice()" class="px-16 py-6 bg-cyan-600/20 border-2 border-cyan-500 rounded-full text-white font-bold hover:bg-cyan-500 transition-all uppercase text-sm shadow-[0_0_50px_rgba(0,212,255,0.4)]"> Aktywuj Głos (Jarvis) </button>
    </div>
    <div id="three-container"></div>
    <script>
        const NGROK_URL = localStorage.getItem('active_ngrok');
        let scene, camera, renderer, current3DObject;
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 30000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('three-container').appendChild(renderer.domElement);
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<15000; i++) starPos.push((Math.random()-0.5)*15000, (Math.random()-0.5)*15000, (Math.random()-0.5)*15000);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.8})));
            camera.position.set(0, 300, 1200);
            animate();
        }
        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        window.onload = init;
    </script>
</body>
</html>
