<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>COPERNIX | LUNA COACH v2.0 PLATINUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }
        .breath-circle { width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, #00d4ff, #667eea); animation: breathe 8s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } }
        .emergency-btn { background: #ff4757; box-shadow: 0 0 30px rgba(255, 71, 87, 0.5); transition: all 0.3s; }
        .emergency-btn:hover { background: #ff6b81; transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="glass p-12 w-full max-w-4xl rounded-3xl text-center relative">
        <h1 class="text-6xl font-black italic mb-4">LUNA COACH</h1>
        <p class="text-sm opacity-70 mb-10 uppercase tracking-widest">Tryb Regeneracji Systemów v2.0</p>
        
        <div id="breath-container" class="flex flex-col items-center justify-center mb-10">
            <div class="breath-circle mb-6"></div>
            <h2 id="phase-label" class="text-4xl font-bold mb-4">Przygotowanie...</h2>
            <p id="timer" class="text-7xl font-black">4:00</p>
            <p id="instruction" class="text-xl mt-6 italic">Za chwilę rozpoczniemy pętlę oddechową</p>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mt-10">
            <button onclick="startCycle()" class="px-8 py-4 bg-cyan-500 hover:bg-cyan-400 text-white font-bold rounded-2xl uppercase transition-all">
                ▶️ Start Regeneracji
            </button>
            <button onclick="pauseCycle()" class="px-8 py-4 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded-2xl uppercase transition-all">
                ⏸️ Pauza
            </button>
        </div>
        
        <button onclick="emergency()" class="emergency-btn w-full mt-8 px-8 py-6 text-white font-bold rounded-2xl uppercase tracking-widest">
            🔴 EMERGENCY PANIC BUTTON
        </button>
        
        <a href="index.html" class="block mt-8 text-cyan-300 hover:text-cyan-100 underline">← Powrót do Hub</a>
    </div>
    
    <script>
        let cycleActive = false;
        let currentPhase = 'prepare';
        let timeLeft = 240; // 4 min regeneracja
        let timerInterval;
        
        function startCycle() {
            if(cycleActive) return;
            cycleActive = true;
            currentPhase = 'regeneration';
            timeLeft = 240; // 4 minuty (240 sekund)
            document.getElementById('phase-label').innerText = 'Faza 1: Regeneracja';
            document.getElementById('instruction').innerText = 'Głębokie, spokojne oddechy. Skupiłam się na odprężeniu...';
            runTimer();
        }
        
        function pauseCycle() {
            cycleActive = false;
            clearInterval(timerInterval);
            document.getElementById('phase-label').innerText = 'Pauza';
            document.getElementById('instruction').innerText = 'Kliknij Start, aby wznowić';
        }
        
        function runTimer() {
            timerInterval = setInterval(() => {
                if(!cycleActive) return;
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').innerText = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if(timeLeft <= 0) {
                    if(currentPhase === 'regeneration') {
                        currentPhase = 'charging';
                        timeLeft = 180; // 3 minuty (180 sekund)
                        document.getElementById('phase-label').innerText = 'Faza 2: Doładowanie';
                        document.getElementById('instruction').innerText = 'Energia wraca! Przygotuj się na dzień...';
                    } else {
                        cycleActive = false;
                        clearInterval(timerInterval);
                        document.getElementById('phase-label').innerText = 'Zakończono!';
                        document.getElementById('instruction').innerText = 'Regeneracja zakończona. 🌟';
                        document.getElementById('timer').innerText = 'GOTOWE';
                    }
                }
            }, 1000);
        }
        
        function emergency() {
            cycleActive = false;
            clearInterval(timerInterval);
            alert('🚨 TRYB AWARYJNY AKTYWNY\n\nNatychmiastowe wsparcie:\n1. Zadzwoń do osoby zaufanej\n2. Zastosuj technikę 5-4-3-2-1\n3. Kontakt: 116 123 (telefon zaufania)');
            document.getElementById('phase-label').innerText = 'Tryb Awaryjny';
            document.getElementById('instruction').innerText = 'Jesteś bezpieczny. Oddychaj powoli...';
        }
    </script>
</body>
</html>
